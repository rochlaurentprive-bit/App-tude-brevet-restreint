<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#041326">
<title>Brevet restreint – Entraînement</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<style>
:root{--bg0:#041326;--bg1:#0a2a4a;--g:rgba(255,255,255,.07);--gb:rgba(255,255,255,.13);--tx:#eaf4ff;--mut:#8fb0cc;--ac:#38d6ff;--ac2:#5b8cff;--gold:#ffc857;--ok:#3ddc97;--ko:#ff5d6c;--c:#38d6ff}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg0);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,system-ui,sans-serif}
body{background:radial-gradient(900px 500px at 85% -5%,rgba(60,130,220,.35),transparent 60%),radial-gradient(700px 500px at -10% 30%,rgba(20,170,200,.18),transparent 60%),linear-gradient(180deg,#041326,#071d36 55%,#041326);background-attachment:fixed}
h1,h2,h3,.disp{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;letter-spacing:-.02em;margin:0}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;padding:0}
#screen{max-width:560px;margin:0 auto;padding:calc(12px + env(safe-area-inset-top)) 14px calc(110px + env(safe-area-inset-bottom))}
.in{animation:rise .45s cubic-bezier(.2,.8,.2,1)}
@keyframes rise{from{opacity:0;transform:translateY(14px)}}
.glass{background:var(--g);border:1px solid var(--gb);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px}
.sec{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mut);font-weight:700;margin:22px 4px 10px}

/* hero */
.hero{position:relative;overflow:hidden;border-radius:28px;padding:20px 18px 74px;background:linear-gradient(145deg,#0d4a85 0%,#0b6fb0 45%,#18a6d6 100%);box-shadow:0 18px 40px -14px rgba(24,166,214,.5)}
.hero:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 85% 15%,rgba(255,255,255,.28),transparent 40%)}
.hero-top{display:flex;justify-content:space-between;gap:10px;position:relative}
.hi{font-size:14px;opacity:.85}
.hero h1{font-size:30px;line-height:1.05;margin-top:4px;font-weight:800}
.flame{background:rgba(0,0,0,.25);border-radius:18px;padding:8px 12px;text-align:center;min-width:64px;height:fit-content;filter:grayscale(1);opacity:.8}
.flame.on{filter:none;opacity:1;box-shadow:0 0 22px rgba(255,150,40,.55)}
.flame span{font-size:22px;display:block;line-height:1}.flame b{font-size:20px;font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;display:block;line-height:1.1}.flame small{font-size:10px;opacity:.8}
.rank{position:relative;display:flex;gap:12px;align-items:center;margin-top:18px;background:rgba(3,22,44,.4);border-radius:18px;padding:10px 12px}
.rk-i{font-size:30px;width:48px;height:48px;border-radius:14px;background:rgba(255,255,255,.14);display:grid;place-items:center}
.rk-b{flex:1;min-width:0}.rk-n{display:flex;justify-content:space-between;gap:8px;font-size:13px;align-items:baseline}.rk-n b{font-size:16px;font-family:"Bricolage Grotesque"}.rk-n span{opacity:.8;font-size:12px}
.xpbar{height:8px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden;margin-top:7px}.xpbar i{display:block;height:100%;background:linear-gradient(90deg,var(--gold),#ff9f43);border-radius:8px;transition:width 1.1s cubic-bezier(.2,.8,.2,1)}
.waves{position:absolute;left:0;bottom:-2px;width:200%;height:70px;animation:wave 9s linear infinite}
.waves.w2{opacity:.5;animation-duration:14s;animation-direction:reverse;bottom:4px}
@keyframes wave{to{transform:translateX(-50%)}}
.boat{position:absolute;right:26px;bottom:34px;font-size:34px;animation:bob 3.4s ease-in-out infinite;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}
@keyframes bob{50%{transform:translateY(-7px) rotate(5deg)}}

/* cta + cards */
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;margin-top:14px;border-radius:22px;background:linear-gradient(120deg,var(--gold),#ff9f43);color:#3a1d00;box-shadow:0 14px 30px -12px rgba(255,159,67,.7);transition:transform .15s}
.cta:active{transform:scale(.97)}
.cta .big{font-size:30px}.cta b{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:19px;display:block}.cta small{font-size:13px;opacity:.8}.cta .go{margin-left:auto;font-size:22px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
.stat{padding:14px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.stat small{color:var(--mut);font-size:12.5px;line-height:1.25}
.ringw{position:relative;width:92px;height:92px}.ringw svg{transform:rotate(-90deg)}
.ringw .t{position:absolute;inset:0;display:grid;place-items:center;font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:20px}
.ringw circle.v{animation:ringin 1.2s cubic-bezier(.2,.8,.2,1)}
@keyframes ringin{from{stroke-dashoffset:var(--c0)}}
.row{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:14px 16px;margin-top:10px;transition:transform .15s}
.row:active{transform:scale(.97)}.row .em{font-size:26px;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:rgba(255,255,255,.1);flex:none}
.row b{display:block;font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px}.row small{color:var(--mut);font-size:13px}.row .ch{margin-left:auto;opacity:.5;font-size:20px}
.row[disabled]{opacity:.4;pointer-events:none}
.tipcard{padding:16px;margin-top:12px;border-left:4px solid var(--gold)}.tipcard small{color:var(--gold);font-weight:700;letter-spacing:.1em;text-transform:uppercase;font-size:11.5px}.tipcard p{margin:6px 0 0;font-size:15.5px}

/* tab bar */
#tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(10px + env(safe-area-inset-bottom));width:min(540px,calc(100% - 20px));display:flex;padding:6px;border-radius:26px;background:rgba(8,30,56,.78);border:1px solid var(--gb);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);z-index:20;box-shadow:0 14px 30px -10px #000}
#tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;padding:8px 0;border-radius:20px;font-size:11.5px;color:var(--mut);transition:all .25s}
#tabs button span{font-size:21px;transition:transform .25s}
#tabs button.on{background:rgba(56,214,255,.16);color:var(--ac)}#tabs button.on span{transform:translateY(-2px) scale(1.12)}

/* learn */
.lc{display:flex;gap:14px;align-items:center;width:100%;text-align:left;padding:14px;margin-top:10px;position:relative;overflow:hidden}
.lc:before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.lc .em{font-size:26px;width:50px;height:50px;border-radius:16px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 22%,transparent);flex:none}
.lc b{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:17px;display:block}.lc small{color:var(--mut);font-size:13px}
.lc .ck{margin-left:auto;font-size:18px}

/* train map */
.chips{display:flex;gap:10px;overflow-x:auto;padding:2px 2px 6px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:11px 16px;border-radius:30px;font-weight:700;font-size:14px;background:var(--g);border:1px solid var(--gb);white-space:nowrap}
.chip[disabled]{opacity:.4}
.map{position:relative;margin-top:10px}.map svg{position:absolute;inset:0;width:100%;height:100%}
.node{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:130px;transition:transform .2s}
.node:active{transform:translate(-50%,-50%) scale(.93)}
.node .ring{width:84px;height:84px;border-radius:50%;padding:6px;background:conic-gradient(var(--c) calc(var(--p)*1%),rgba(255,255,255,.14) 0);box-shadow:0 0 26px -4px var(--c);animation:pulse 3.2s ease-in-out infinite}
.node .ic{display:grid;place-items:center;width:100%;height:100%;border-radius:50%;background:var(--bg1);font-size:32px}
.node .nm{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:700;font-size:13.5px;text-align:center;line-height:1.1}
.node .st{font-size:15px;letter-spacing:2px;color:var(--gold)}.node .st i{font-style:normal;opacity:.25}
@keyframes pulse{50%{box-shadow:0 0 34px 2px var(--c)}}

/* profile */
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.kpi{padding:12px 6px;text-align:center}.kpi b{display:block;font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:24px}.kpi small{color:var(--mut);font-size:12px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.bd{padding:12px 6px;text-align:center}.bd .i{font-size:30px;display:block}.bd b{display:block;font-size:12.5px;line-height:1.2;margin-top:4px}.bd small{display:block;font-size:11px;color:var(--mut);line-height:1.25;margin-top:2px}
.bd.lock{opacity:.4;filter:grayscale(1)}
.hist{display:flex;justify-content:space-between;padding:9px 2px;border-bottom:1px solid var(--gb);font-size:14px}.hist:last-child{border:0}
.ghost{display:block;width:100%;margin-top:10px;padding:13px;border-radius:16px;border:1px solid var(--gb);font-weight:600;color:var(--mut);text-align:center}
.note{font-size:12.5px;color:var(--mut);margin:18px 4px 0;line-height:1.5}

/* overlays */
#ov{position:fixed;inset:0;z-index:50;background:linear-gradient(180deg,#05172c,#082545 60%,#05172c);overflow-y:auto;display:none}
#ov.on{display:block}
@keyframes fade{from{opacity:0}}
.ovp{max-width:560px;margin:0 auto;min-height:100%;padding:calc(12px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column}
.ovtop{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.x{width:38px;height:38px;border-radius:50%;background:var(--g);border:1px solid var(--gb);font-size:16px;flex:none}
.seg{flex:1;display:flex;gap:4px}.seg i{flex:1;height:7px;border-radius:5px;background:rgba(255,255,255,.14);transition:background .3s}
.seg i.ok{background:var(--ok)}.seg i.ko{background:var(--ko)}.seg i.cur{background:var(--ac)}.seg i.dn{background:var(--ac2)}
.combo{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:16px;min-width:54px;text-align:right;color:var(--gold)}
.combo.pop{animation:pop .4s}
@keyframes pop{40%{transform:scale(1.5)}}
.tmr{font-variant-numeric:tabular-nums;font-weight:800;font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;background:var(--g);border:1px solid var(--gb);padding:6px 11px;border-radius:20px;font-size:14px}.tmr.low{color:var(--ko);border-color:var(--ko)}
.qwrap{flex:1}
.tag{display:inline-flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;padding:5px 12px;border-radius:20px;background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c)}
.figs{display:flex;justify-content:center;gap:8px;margin:14px 0 4px;flex-wrap:wrap}
.figs svg{height:120px;width:auto;background:rgba(255,255,255,.06);border-radius:16px}
.qtext{font-size:24px;line-height:1.2;font-weight:800;margin:14px 0 18px}
.opt{display:flex;gap:12px;align-items:center;width:100%;text-align:left;padding:14px;margin-bottom:10px;border-radius:18px;background:var(--g);border:2px solid var(--gb);font-size:16.5px;transition:transform .15s,border-color .2s,background .2s;animation:rise .35s}
.opt.ok,.opt.dim,.opt.sel{animation:none}
.opt:active{transform:scale(.98)}
.ltr{flex:none;width:32px;height:32px;border-radius:10px;background:rgba(255,255,255,.12);display:grid;place-items:center;font-weight:800;font-size:14px}
.opt.sel{border-color:var(--ac);background:rgba(56,214,255,.12)}
.opt.ok{border-color:var(--ok);background:rgba(61,220,151,.16)}.opt.ok .ltr{background:var(--ok);color:#052}
.opt.ko{border-color:var(--ko);background:rgba(255,93,108,.16);animation:shake .4s}.opt.ko .ltr{background:var(--ko)}
.opt.dim{opacity:.45}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
.sheet{position:sticky;bottom:0;margin:12px -16px calc(-24px - env(safe-area-inset-bottom));padding:18px 18px calc(22px + env(safe-area-inset-bottom));border-radius:26px 26px 0 0;animation:up .35s cubic-bezier(.2,.8,.2,1);box-shadow:0 -20px 40px -10px rgba(0,0,0,.6)}
@keyframes up{from{transform:translateY(100%)}}
.sheet.ok{background:#0d3a35;border-top:2px solid var(--ok)}.sheet.ko{background:#3a1522;border-top:2px solid var(--ko)}.sheet.neutral{background:#0b2a4d;border-top:2px solid var(--ac)}
.sheet h3{font-size:20px}.sheet.ok h3{color:var(--ok)}.sheet.ko h3{color:var(--ko)}
.sheet p{margin:8px 0 14px;font-size:15px;line-height:1.5;color:#d5e6f5}
.prim{display:block;width:100%;padding:15px;border-radius:18px;font-weight:800;font-size:16.5px;background:linear-gradient(120deg,var(--ac),var(--ac2));color:#02213a;text-align:center;box-shadow:0 10px 24px -10px var(--ac);transition:transform .15s}
.prim:active{transform:scale(.97)}.sheet.ok .prim{background:var(--ok);color:#03281a;box-shadow:none}.sheet.ko .prim{background:var(--ko);color:#fff;box-shadow:none}
.prim[disabled]{opacity:.4;pointer-events:none}
.sec2{background:var(--g);border:1px solid var(--gb)}
.bar2{margin-top:auto;padding-top:14px}
.xpop{position:fixed;left:50%;top:26%;transform:translateX(-50%);font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:34px;color:var(--gold);pointer-events:none;animation:xpf 1.1s ease-out forwards;text-shadow:0 4px 20px rgba(0,0,0,.5);z-index:60}
@keyframes xpf{to{transform:translate(-50%,-90px);opacity:0}}
.dlg{position:fixed;inset:0;background:rgba(0,0,0,.6);display:grid;place-items:center;z-index:70;padding:24px;animation:fade .2s}
.dlg>div{background:#0b2a4d;border:1px solid var(--gb);border-radius:24px;padding:22px;max-width:340px;width:100%;text-align:center}
.dlg p{color:var(--mut);margin:8px 0 18px}.dlg .two{margin:0}

/* fiche */
.fcard{padding:22px 20px;margin-top:6px;border-top:4px solid var(--c);animation:rise .4s}
.fcard h2{font-size:27px;line-height:1.1;margin:12px 0 14px;font-weight:800}
.fcard ul{list-style:none;margin:0;padding:0}.fcard li{padding:9px 0 9px 28px;position:relative;font-size:16px;line-height:1.4;border-bottom:1px solid rgba(255,255,255,.07)}
.fcard li:last-child{border:0}.fcard li:before{content:"›";position:absolute;left:6px;top:6px;font-size:22px;color:var(--c);font-weight:800}
.mn{margin-top:16px;padding:14px 16px;border-radius:18px;background:linear-gradient(120deg,rgba(255,200,87,.18),rgba(255,159,67,.1));border:1px solid rgba(255,200,87,.35)}
.mn small{display:block;color:var(--gold);font-weight:800;letter-spacing:.12em;text-transform:uppercase;font-size:11px;margin-bottom:3px}
.dots{flex:1;display:flex;gap:6px;justify-content:center}.dots i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.2);transition:all .3s}.dots i.on{background:var(--c);width:24px;border-radius:5px}
.navr{display:flex;gap:10px;margin-top:auto;padding-top:16px}.navr .prim{flex:1}.navr .back{flex:none;width:56px;border-radius:18px;background:var(--g);border:1px solid var(--gb);font-size:20px}

/* result */
.res{text-align:center;padding-top:6px}
.trophy{font-size:68px;animation:bob 3s ease-in-out infinite;display:inline-block}
.stars{font-size:38px;letter-spacing:6px;color:var(--gold);margin:2px 0}.stars i{font-style:normal;opacity:.22;display:inline-block}.stars i.on{opacity:1;animation:pop .6s backwards}
.big-n{font-family:"Bricolage Grotesque","Avenir Next","Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-weight:800;font-size:64px;line-height:1}
.chips2{display:flex;gap:10px;justify-content:center;margin:14px 0;flex-wrap:wrap}.chips2 span{padding:8px 14px;border-radius:20px;background:var(--g);border:1px solid var(--gb);font-weight:700;font-size:14px}
.up{padding:12px;border-radius:18px;background:linear-gradient(120deg,rgba(255,200,87,.25),rgba(255,159,67,.15));border:1px solid rgba(255,200,87,.4);font-weight:700;margin:10px 0}
.rev{text-align:left;padding:14px;margin-top:10px;border-left:4px solid var(--ko)}.rev b{display:block;font-size:15.5px;line-height:1.3}.rev .g{color:var(--ok);margin-top:6px;font-size:14.5px}.rev .r{color:var(--ko);margin-top:6px;font-size:14px}.rev .e{color:var(--mut);margin-top:6px;font-size:13.5px}
#cf{position:fixed;inset:0;pointer-events:none;z-index:80}
#toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);z-index:90;display:flex;flex-direction:column;gap:8px;width:min(92%,420px);pointer-events:none}
.toast{background:#102f55;border:1px solid var(--gold);border-radius:18px;padding:12px 16px;display:flex;gap:12px;align-items:center;animation:drop .5s cubic-bezier(.2,.8,.2,1),fade .4s 3.2s reverse forwards;box-shadow:0 12px 30px -8px #000}
.toast .i{font-size:28px}.toast small{display:block;color:var(--gold);font-weight:800;font-size:11px;letter-spacing:.1em;text-transform:uppercase}
@keyframes drop{from{transform:translateY(-120%)}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-iteration-count:1!important;transition:none!important}}
</style>
</head>
<body>
<div id="screen"></div>
<nav id="tabs"></nav>
<div id="ov"></div>
<div id="toast"></div>
<canvas id="cf"></canvas>
<script>
var THEMES={
 route:{n:"Règles de route",i:"🧭"},
 balisage:{n:"Balisage (AISM A)",i:"🔴"},
 feux:{n:"Feux et signaux",i:"💡"},
 securite:{n:"Sécurité et secours",i:"🛟"},
 meteo:{n:"Météo",i:"⛅"},
 nav:{n:"Navigation et calculs",i:"📐"},
 manoeuvre:{n:"Manœuvres et matelotage",i:"⚓"},
 pratique:{n:"Bonnes pratiques",i:"✅"}
};
var QS=[];
function Q(t,q,r,w,e,f){QS.push({t:t,q:q,o:[r].concat(w),e:e,f:f||null});}

/* --- Règles de route --- */
Q("route","Deux bateaux à moteur se croisent sur des routes qui se coupent. Lequel doit manœuvrer ?","Celui qui voit l'autre bateau à sa droite (tribord)",["Celui qui voit l'autre bateau à sa gauche (bâbord)","Le plus petit des deux","Le plus rapide des deux"],"Règle de la priorité à droite (RIPAM règle 15) : le bateau qui voit l'autre sur son tribord cède le passage et évite de couper sa route devant lui.");
Q("route","Deux bateaux à moteur se rencontrent face à face (routes inverses). Que fait chacun ?","Chacun vient sur tribord (à droite) et on se croise bâbord contre bâbord",["Chacun vient sur bâbord (à gauche)","Le plus petit s'écarte, l'autre garde son cap","Les deux ralentissent sans changer de cap"],"RIPAM règle 14 : chacun change de cap vers tribord pour passer bâbord contre bâbord.");
Q("route","Un bateau rattrape et dépasse un autre bateau. Qui doit s'écarter ?","Le bateau qui dépasse, jusqu'à ce qu'il soit complètement passé et dégagé",["Le bateau dépassé, qui doit lui laisser la place","Celui des deux qui a le plus gros moteur","Le bateau qui voit l'autre sur sa droite"],"RIPAM règle 13 : le bateau qui rattrape garde la route libre. Il reste le bateau qui dépasse jusqu'à être définitivement passé et clair.");
Q("route","Deux voiliers se croisent avec le vent de côtés opposés. Lequel s'écarte ?","Celui qui reçoit le vent par bâbord (amures bâbord)",["Celui qui reçoit le vent par tribord (amures tribord)","Le plus petit des deux","Celui qui est le plus au vent"],"RIPAM règle 12 : amures bâbord cède à amures tribord. L'amure est le côté d'où vient le vent.");
Q("route","Deux voiliers ont le vent du même côté. Lequel s'écarte ?","Celui qui est au vent (le plus proche de l'origine du vent)",["Celui qui est sous le vent","Le plus rapide","Celui qui est le plus loin de la côte"],"Règle 12 : le voilier au vent cède au voilier sous le vent, qui ne peut pas facilement s'écarter.");
Q("route","En règle générale, un bateau à moteur croise un voilier (hors chenal étroit et dépassement). Qui s'écarte ?","Le bateau à moteur",["Le voilier","Le plus gros des deux","Le plus lent des deux"],"RIPAM règle 18 : un bateau à moteur s'écarte d'un bateau à voile. Exceptions : dépassement, chenal étroit, dispositif de séparation du trafic.");
Q("route","Dans un chenal étroit, où doit se tenir un bateau ?","Le plus près possible du bord tribord (à droite) du chenal",["Au milieu du chenal","Le plus près possible du bord bâbord (à gauche)","Du côté où le courant est le plus fort"],"RIPAM règle 9 : dans un chenal étroit on reste à droite, comme sur la route, à condition que ce soit sûr et réalisable.");
Q("route","De quoi dépend la vitesse de sécurité (règle 6) ?","De la visibilité, de la densité du trafic, de l'état de la mer et de la manœuvrabilité du bateau",["Uniquement de la puissance du moteur","D'une limite fixe de 5 nœuds partout","Uniquement de l'heure du jour"],"La vitesse de sécurité doit permettre d'éviter un abordage et de s'arrêter dans une distance adaptée aux conditions.");
Q("route","Quand faut-il tenir une veille attentive (règle 5) ?","En permanence, par la vue, l'ouïe et tous les moyens disponibles",["Seulement de nuit","Seulement par brouillard","Inutile si on utilise un GPS ou un radar"],"La veille est obligatoire en toutes circonstances. Les instruments ne remplacent jamais la vue et l'ouïe.");
Q("route","Comment doit être une manœuvre pour éviter un abordage (règle 8) ?","Franche, prise suffisamment tôt et assez ample pour être vue de l'autre bateau",["Faite de petits changements de cap successifs","Décidée à la dernière seconde","Limitée à un simple changement de vitesse minime"],"Une manœuvre timide ou tardive n'est pas comprise par l'autre bateau et laisse subsister le risque de collision.");
Q("route","Vous êtes le bateau privilégié (stand-on). Que faites-vous ?","Je maintiens cap et vitesse, mais je manœuvre si l'autre ne fait rien et que l'abordage devient imminent",["Je ralentis toujours pour laisser passer","Je vire à bâbord immédiatement","Je coupe le moteur tout de suite"],"Règle 17 : on maintient route et vitesse, mais on doit agir dès qu'il est clair que l'autre ne manœuvre pas. Quand l'abordage ne peut plus être évité par le seul bateau qui cède, on manœuvre aussi.");
Q("route","Un bateau de plaisance à moteur doit s'écarter de la route de…","un voilier, un bateau en train de pêcher ou un bateau qui ne maîtrise pas sa manœuvre",["un bateau à moteur plus petit que lui","un bateau à moteur qui arrive par sa bâbord","aucun bateau, le moteur est toujours prioritaire"],"RIPAM règle 18 : ordre de priorité décroissant : bateau qui ne maîtrise pas sa manœuvre, à capacité de manœuvre restreinte, pêche, voile, puis moteur.");

/* --- Balisage --- */
Q("balisage","Cette bouée cylindrique rouge, vue en venant du large vers le port, marque…","le côté bâbord (gauche) du chenal",["le côté tribord (droite) du chenal","un danger isolé","des eaux saines au centre"],"En région A (Europe), le sens conventionnel du balisage est « en venant du large ». Rouge, cylindrique = bâbord. On la laisse à sa gauche.","port");
Q("balisage","Cette bouée conique verte, vue en venant du large vers le port, marque…","le côté tribord (droite) du chenal",["le côté bâbord (gauche) du chenal","une zone de baignade","un danger isolé"],"Vert et conique = tribord. On la laisse à sa droite en entrant dans le chenal.","stbd");
Q("balisage","En remontant un chenal depuis le large, une bouée verte conique se laisse…","à tribord (à droite de son bateau)",["à bâbord (à gauche de son bateau)","indifféremment à droite ou à gauche","toujours au large"],"Les marques latérales tribord (vertes) se laissent à tribord, les rouges à bâbord, dans le sens conventionnel (du large vers le port).");
Q("balisage","Cette marque cardinale indique…","des eaux navigables au nord de la marque : on passe au nord",["un danger isolé","des eaux navigables au sud de la marque","une zone spéciale"],"Cardinale Nord : noir au-dessus, jaune en dessous, deux cônes noirs pointe en haut. Elle se contourne par le nord.","N");
Q("balisage","Cette marque cardinale indique…","des eaux navigables à l'est de la marque : on passe à l'est",["des eaux navigables à l'ouest","un danger isolé","des eaux saines tout autour"],"Cardinale Est : noir-jaune-noir, deux cônes base contre base (bases face à face).","E");
Q("balisage","Cette marque cardinale indique…","des eaux navigables au sud de la marque : on passe au sud",["des eaux navigables au nord de la marque","une épave nouvelle","une zone spéciale"],"Cardinale Sud : jaune au-dessus, noir en dessous, deux cônes noirs pointe en bas.","S");
Q("balisage","Cette marque cardinale indique…","des eaux navigables à l'ouest de la marque : on passe à l'ouest",["des eaux navigables à l'est de la marque","un danger isolé","le côté tribord d'un chenal"],"Cardinale Ouest : jaune-noir-jaune, deux cônes pointe contre pointe (forme de sablier).","W");
Q("balisage","Cette bouée noire à bande rouge, avec deux boules noires, signale…","un danger isolé : on la contourne en gardant ses distances",["des eaux saines","une zone de baignade","le côté bâbord d'un chenal"],"Marque de danger isolé : elle est posée sur ou au-dessus d'un danger de petite étendue, les eaux navigables l'entourent.","iso");
Q("balisage","Cette bouée à rayures verticales rouges et blanches, avec une boule rouge, signale…","des eaux saines : eaux navigables tout autour (milieu de chenal, atterrissage)",["un danger isolé","un côté tribord de chenal","une zone réservée"],"Marque d'eaux saines : on peut passer tout autour d'elle. Elle marque par exemple l'axe d'un chenal ou un atterrissage.","safe");
Q("balisage","Cette bouée jaune avec une croix jaune en tête est…","une marque spéciale (ex. zone de baignade, câbles, zone réservée)",["une cardinale Nord","un danger isolé","une marque d'eaux saines"],"Les marques spéciales n'aident pas à la navigation mais délimitent une zone particulière. Se renseigner sur la zone qu'elle délimite.","special");
Q("balisage","Cette bouée à rayures bleues et jaunes verticales signale…","un danger nouveau, par exemple une épave récente",["des eaux saines","une zone de baignade","la limite d'un chenal"],"Marque d'« épave d'urgence » : bleu et jaune, feu alterné bleu/jaune. Elle signale un nouveau danger tant qu'il n'est pas porté sur les cartes.","wreck");
Q("balisage","Un feu blanc scintillant groupé par 3 sur une marque cardinale indique…","une marque cardinale Est",["une marque cardinale Nord","une marque cardinale Ouest","un danger isolé"],"Les groupes de scintillements imitent un cadran : Est = 3, Sud = 6 + un éclat long, Ouest = 9. Le Nord scintille en continu.");

/* --- Feux et signaux --- */
Q("feux","De nuit, quels feux montre un bateau à moteur de moins de 50 m en route ?","Un feu de mât blanc, deux feux de côté (rouge à bâbord, vert à tribord) et un feu de poupe blanc",["Seulement un feu blanc visible de tout l'horizon","Seulement un feu rouge et un feu vert","Deux feux rouges superposés"],"RIPAM règle 23 : feu de mât (225°), feux de côté de 112,5° chacun, feu de poupe (135°).");
Q("feux","Un feu de côté rouge est situé…","à bâbord (côté gauche du bateau)",["à tribord (côté droit du bateau)","à l'arrière","en tête de mât"],"Bâbord = rouge, tribord = vert. Moyen mnémotechnique : « bâbord, rouge, port ».");
Q("feux","De nuit, un voilier en route de moins de 20 m montre…","des feux de côté et un feu de poupe (ou un feu tricolore en tête de mât)",["un seul feu blanc tout autour","deux feux rouges superposés","un feu vert au-dessus d'un feu blanc"],"Règle 25 : un voilier sous voiles montre les feux de côté et de poupe. S'il utilise son moteur, il est considéré comme un bateau à moteur.");
Q("feux","De nuit, un bateau au mouillage (moins de 50 m) montre…","un feu blanc visible de tout l'horizon",["un feu rouge et un feu vert","trois feux rouges superposés","deux feux blancs de côté"],"Règle 30 : un bateau au mouillage montre un feu blanc tout autour à l'avant.");
Q("feux","Deux feux rouges superposés visibles de tout l'horizon indiquent…","un bateau qui ne maîtrise pas sa manœuvre",["un bateau au mouillage","un bateau qui pêche au chalut","un voilier en route"],"Bateau qui n'est pas maître de sa manœuvre : deux feux rouges superposés. Il est prioritaire sur les autres bateaux.");
Q("feux","Un feu vert au-dessus d'un feu blanc, tous deux visibles de tout l'horizon, indique…","un bateau qui pêche au chalut",["un bateau au mouillage","un voilier","un bateau qui ne maîtrise pas sa manœuvre"],"Chalutier : vert au-dessus de blanc. Autres pêcheurs : rouge au-dessus de blanc.");
Q("feux","Un son bref à la corne de brume signifie…","« je viens sur tribord »",["« je viens sur bâbord »","« je bats en arrière »","« danger, je ne comprends pas vos intentions »"],"Règle 34 : 1 son bref = tribord, 2 = bâbord, 3 = machine en arrière. Un son bref dure environ 1 seconde.");
Q("feux","Deux sons brefs à la corne de brume signifient…","« je viens sur bâbord »",["« je viens sur tribord »","« je bats en arrière »","« je suis au mouillage »"],"Règle 34 : 2 sons brefs = je viens sur bâbord.");
Q("feux","Trois sons brefs signifient…","« je bats en arrière » (ma machine est en marche arrière)",["« je viens sur tribord »","« je suis au mouillage »","« je suis en détresse »"],"3 sons brefs = propulsion en marche arrière.");
Q("feux","Cinq sons brefs ou plus signifient…","je ne comprends pas vos intentions ou je doute de vos actions : danger de collision",["je suis en détresse et j'appelle les secours","je m'engage dans un chenal","je veux dépasser par tribord"],"Règle 34(d) : signal de doute ou de danger lorsqu'on ne comprend pas les intentions de l'autre bateau.");
Q("feux","Par visibilité réduite, un bateau à moteur qui fait route émet…","un son prolongé à intervalles de 2 minutes au plus",["deux sons prolongés toutes les 2 minutes","un son bref toutes les 10 secondes","aucun signal si le radar est allumé"],"Règle 35 : un son prolongé (4 à 6 s) au plus toutes les 2 minutes quand le bateau a de l'erre.");
Q("feux","Par visibilité réduite, un bateau à moteur en route mais stoppé (sans erre) émet…","deux sons prolongés à intervalles de 2 minutes au plus",["un seul son prolongé","trois sons brefs","un son bref toutes les minutes"],"Règle 35 : deux sons prolongés, séparés d'environ 2 secondes, au plus toutes les 2 minutes.");

/* --- Sécurité --- */
Q("securite","Combien de gilets de sauvetage faut-il à bord ?","Un par personne à bord, adapté à sa taille et à son poids",["Un pour deux personnes","Un seul, pour le skipper","Aucun si tout le monde sait nager"],"Chaque personne doit pouvoir porter un gilet adapté. Le port est recommandé en permanence, obligatoire dans de nombreux cas (enfants, mauvais temps, nuit).");
Q("securite","Quelqu'un tombe à l'eau. Votre toute première réaction ?","Crier « Homme à la mer ! », lancer une bouée et ne jamais le perdre de vue",["Couper le moteur et sauter à l'eau","Continuer tranquillement et appeler plus tard","Faire demi-tour sans prévenir l'équipage"],"Alerter, lancer un moyen de flottaison, désigner un guetteur qui pointe la personne du doigt. Marquer la position sur le GPS (touche MOB).");
Q("securite","Quel canal VHF est utilisé pour la détresse et l'appel ?","Le canal 16",["Le canal 6","Le canal 72","Le canal 10"],"Le canal 16 est le canal international d'appel et de détresse. On passe ensuite sur un canal de travail pour la conversation.");
Q("securite","Que signifie le message radio « Pan-Pan » ?","Message d'urgence : sécurité d'un bateau ou d'une personne en jeu, mais pas de danger grave et imminent",["Message de détresse : danger grave et imminent","Message de sécurité sur la météo","Appel de routine entre bateaux"],"Mayday = détresse. Pan-Pan = urgence. Sécurité = information importante de sécurité (météo, danger pour la navigation).");
Q("securite","Quel est un signal de détresse reconnu ?","Une fusée à parachute à feu rouge",["Une fusée verte à main","Un pavillon blanc agité","Un coup de corne long"],"Autres signaux : feux rouges à main, fumigène orange, signal SOS, bras levés et baissés lentement, Mayday à la VHF.");
Q("securite","Que signifie le fait de lever et d'abaisser lentement et à répétition les bras étendus de chaque côté ?","C'est un signal de détresse",["Un salut amical","Je demande un passage","Je m'apprête à mouiller"],"Mouvement lent et répété des bras écartés = signal de détresse visuel reconnu.");
Q("securite","Début d'incendie dans le compartiment moteur. Que faire en priorité ?","Arrêter le moteur, couper l'arrivée de carburant, utiliser l'extincteur et faire enfiler les gilets",["Ouvrir grand le capot pour voir le feu","Accélérer pour atteindre la côte","Jeter de l'eau sur le moteur avec un seau"],"On évite d'ouvrir largement le compartiment : l'apport d'air attiserait le feu. On utilise l'extincteur par un orifice ou une trappe.");
Q("securite","Avant de partir en mer, quelle précaution est essentielle ?","Prévenir un proche de l'itinéraire et de l'heure de retour",["Couper la VHF pour économiser la batterie","Partir sans consulter la météo","Éviter d'expliquer le matériel de sécurité"],"Un proche à terre peut donner l'alerte si vous n'êtes pas rentré. Consultez aussi la météo, le carburant, le matériel de sécurité.");
Q("securite","Tombé à l'eau froide en attente de secours, que faire ?","Rester calme, limiter ses mouvements, garder gilet et vêtements",["Nager vers la côte lointaine","Enlever vêtements et chaussures","Boire de l'alcool pour se réchauffer"],"L'eau froide épuise vite. Les vêtements isolent un peu. Nager disperse la chaleur et accélère l'hypothermie.");
Q("securite","Sur un petit bateau à moteur hors-bord, à quoi sert le coupe-circuit à cordon ?","À couper le moteur si le pilote est éjecté ou tombe",["À économiser du carburant","À démarrer le moteur plus vite","À régler le régime en croisière"],"Le cordon est attaché au pilote. S'il tombe à l'eau, le moteur s'arrête et le bateau ne tourne pas en cercle.");
Q("securite","Quel danger présentent les gaz d'échappement dans une cabine fermée ?","Une intoxication au monoxyde de carbone, un gaz inodore et mortel",["Aucun, ces gaz sont inoffensifs","Seulement une odeur désagréable","Un risque de brûlure"],"Le monoxyde de carbone est invisible et sans odeur. Il faut ventiler, surtout avec groupe électrogène ou chauffage.");
Q("securite","Le mal de mer s'atténue en général en…","restant à l'air frais, au milieu du bateau, en regardant l'horizon",["restant dans la cabine, enfermé","lisant une carte en détail","buvant beaucoup de café"],"L'air frais, la position centrale (moins de mouvement) et l'horizon aident. Prendre la barre est aussi efficace.");
Q("securite","Une voie d'eau se déclare à bord. Que faire ?","Localiser la brèche, la colmater, pomper, équiper les passagers et appeler les secours si besoin",["Ignorer, tant que le bateau flotte","Mettre tout le monde à l'avant du bateau","Couper la VHF pour économiser la batterie"],"Agir vite : trouver l'entrée d'eau, la boucher, évacuer l'eau, gilets sur tous, et alerter les secours si la situation se dégrade.");

/* --- Météo --- */
Q("meteo","Force 6 de l'échelle de Beaufort correspond à…","un vent fort d'environ 22 à 27 nœuds",["un vent faible de 1 à 3 nœuds","un vent modéré de 11 à 16 nœuds","un coup de vent de 34 à 40 nœuds"],"Force 4 = 11-16 nds, force 5 = 17-21, force 6 = 22-27, force 7 = 28-33, force 8 = 34-40 (coup de vent).");
Q("meteo","À partir de quelle force Beaufort parle-t-on de coup de vent ?","Force 8",["Force 5","Force 6","Force 10"],"Force 7 = grand frais, force 8 = coup de vent (34-40 nœuds).");
Q("meteo","Le baromètre chute rapidement. Que faut-il attendre ?","Une dégradation du temps et un renforcement du vent",["Une amélioration rapide du temps","Un temps inchangé","Un calme plat"],"Une chute de pression rapide annonce l'arrivée d'une dépression, avec vent fort, pluie et mer agitée.");
Q("meteo","Dans l'hémisphère nord, le vent autour d'une dépression tourne…","dans le sens inverse des aiguilles d'une montre, en convergeant vers le centre",["dans le sens des aiguilles d'une montre","en ligne droite, sans rotation","uniquement du nord vers le sud"],"Autour d'une dépression (hémisphère nord) : sens anti-horaire. Autour d'un anticyclone : sens horaire.");
Q("meteo","Selon la loi de Buys-Ballot (hémisphère nord), le dos au vent, la dépression se trouve…","sur la gauche",["sur la droite","derrière soi","devant soi"],"Dos au vent, les basses pressions sont à gauche. Cela aide à situer une dépression qui approche.");
Q("meteo","Un anticyclone est généralement associé à…","un temps plutôt stable, avec peu de nuages",["des pluies fortes et du vent","des orages permanents","un brouillard systématique"],"Hautes pressions : temps plutôt calme et stable (le brouillard est cependant possible).");
Q("meteo","Au passage d'un front froid, on observe souvent…","des grains, un vent qui se renforce et vire à droite, et une baisse de la température",["un calme plat, un temps chaud","une pression qui chute encore longtemps","un brouillard dense sans vent"],"Passage d'un front froid : grains, rafales, rotation du vent à droite (hémisphère nord), baisse de la température, remontée de la pression.");
Q("meteo","La brise de mer souffle généralement…","le jour, de la mer vers la terre",["la nuit, de la mer vers la terre","le jour, de la terre vers la mer","uniquement en hiver"],"Le jour, la terre se réchauffe, l'air monte et l'air plus frais de la mer arrive. La nuit, c'est l'inverse (brise de terre).");
Q("meteo","Quand le vent s'oppose au courant ou à la marée, la mer est…","plus creuse et plus courte, donc plus dangereuse",["plus calme","inchangée","plus longue et plus douce"],"Vent contre courant : les vagues se raidissent et deviennent courtes et abruptes.");
Q("meteo","Avant de sortir, que faut-il faire ?","Consulter un bulletin météo marine récent et regarder la tendance",["Regarder seulement le ciel depuis le quai","Se fier à la météo de la veille","Partir sans rien vérifier si le matin est beau"],"La météo marine donne vent, rafales, houle, visibilité. Vérifier aussi la tendance sur la durée de la sortie.");
Q("meteo","Un orage menace en mer. Quelle est la meilleure attitude ?","Rejoindre un abri, réduire la voilure, équiper l'équipage et éviter de toucher les parties métalliques",["Rester au large pour regarder","Monter en haut du mât","Naviguer à pleine vitesse vers le grain"],"Les éclairs et grains sont dangereux. S'abriter, se protéger et éviter les contacts avec le gréement et les mains courantes métalliques.");
Q("meteo","Par brouillard, que doit faire le skipper ?","Réduire sa vitesse, tenir une veille renforcée et émettre les signaux sonores réglementaires",["Garder sa vitesse pour sortir plus vite du brouillard","Éteindre ses feux pour économiser la batterie","Rester au milieu du chenal sans rien émettre"],"Visibilité réduite : vitesse de sécurité, veille, signaux sonores, feux allumés, et utiliser le radar si disponible.");

/* --- Navigation --- */
Q("nav","Un mille nautique équivaut à…","1 852 mètres",["1 000 mètres","1 609 mètres","2 000 mètres"],"1 mille nautique = 1 852 m, soit une minute d'arc de latitude.");
Q("nav","Un nœud correspond à…","un mille nautique par heure",["un kilomètre par heure","un mètre par seconde","un mille terrestre par heure"],"1 nœud = 1 mille nautique/heure, soit environ 1,852 km/h.");
Q("nav","À 6 nœuds, combien de temps faut-il pour parcourir 3 milles ?","30 minutes",["20 minutes","45 minutes","1 heure"],"Temps = distance / vitesse = 3 / 6 = 0,5 h, soit 30 minutes.");
Q("nav","Quelle distance parcourt-on à 5 nœuds en 2 h 30 ?","12,5 milles",["10 milles","7,5 milles","15 milles"],"Distance = vitesse × temps = 5 × 2,5 = 12,5 milles.");
Q("nav","Un cap au 270° correspond à…","l'ouest",["l'est","le sud","le nord"],"0° = nord, 90° = est, 180° = sud, 270° = ouest.");
Q("nav","Quel est le cap inverse du cap 045° ?","225°",["135°","315°","180°"],"Cap inverse = cap + 180° (ou − 180° si le résultat dépasse 360°). 045 + 180 = 225.");
Q("nav","La déclinaison magnétique est…","l'angle entre le nord vrai (géographique) et le nord magnétique",["l'écart dû au fer et aux appareils à bord","la différence entre deux caps successifs","la pente du fond marin"],"Elle varie selon le lieu et l'année et figure sur la carte (rose de compas). À ne pas confondre avec la déviation.");
Q("nav","La déviation du compas est causée par…","les masses métalliques et appareils électriques à bord",["la rotation de la Terre","l'inclinaison du fond marin","la houle"],"Elle dépend du cap suivi et du bateau. Éloigner du compas téléphones, haut-parleurs, outils en fer.");
Q("nav","Sur une carte marine, une minute de latitude correspond à…","un mille nautique",["un nœud","un kilomètre","dix encablures"],"L'échelle des latitudes (sur les côtés de la carte) sert à mesurer les distances : 1' = 1 mille.");
Q("nav","Les sondes d'une carte marine sont rapportées…","au zéro des cartes (niveau de référence proche des plus basses mers)",["au niveau moyen de la mer","au niveau des plus hautes mers","au niveau au moment de la sortie"],"La profondeur réelle = sonde + hauteur de marée au moment considéré. Le zéro des cartes est un niveau très bas.");
Q("nav","Pourquoi garder une marge de profondeur sous la quille ?","Pour les vagues, l'imprécision des sondes, le tangage et les variations de marée",["Parce que la carte ne donne jamais la profondeur","Pour économiser le carburant","Parce que le sondeur est inutile"],"Une marge de sécurité évite l'échouement : prévoir large, surtout dans des eaux peu connues.");
Q("nav","Les marées de vives-eaux se produisent…","autour de la pleine lune et de la nouvelle lune",["autour des quartiers de lune","uniquement en hiver","uniquement la nuit"],"À pleine et nouvelle lune, Soleil et Lune s'alignent : marnage maximum. Aux quartiers, on a les mortes-eaux.");
Q("nav","D'après la règle des douzièmes, la 3e heure de marée montante apporte…","3/12 du marnage",["1/12 du marnage","2/12 du marnage","4/12 du marnage"],"Règle des douzièmes : 1/12, 2/12, 3/12, 3/12, 2/12, 1/12 pour les 6 heures de marée.");
Q("nav","Sur un GPS, que signifie SOG ?","Vitesse sur le fond (Speed Over Ground)",["Cap compas","Vitesse dans l'eau","Profondeur sous quille"],"SOG = vitesse sur le fond. COG = cap sur le fond. Ce ne sont pas ceux du compas ni du loch.");

/* --- Manœuvres --- */
Q("manoeuvre","Pour accoster, comment aborder le quai ?","Plutôt face au vent ou au courant dominant (le plus fort), à petite vitesse",["Vent ou courant dans le dos, à toute vitesse","En diagonale, à pleine puissance","Peu importe : toujours pareil"],"Face au vent/courant, le bateau garde une meilleure gouverne et ralentit plus facilement. Approcher lentement.");
Q("manoeuvre","Quelle longueur de chaîne ou de touée faut-il filer au mouillage ?","Au moins 3 à 5 fois la profondeur, plus par mauvais temps",["Égale à la profondeur","1,5 fois la profondeur","10 mètres, toujours"],"Plus la touée est longue, plus l'ancre tient. Prendre en compte la marée et le vent à venir.");
Q("manoeuvre","Comment mouiller une ancre ?","Arriver face au vent ou au courant, stopper, descendre l'ancre puis reculer en filant la touée",["Jeter l'ancre en pleine vitesse","Mouiller par l'arrière, vent dans le dos","Laisser l'ancre pendre sans la poser"],"On pose l'ancre bateau stoppé, puis on la fait croche en reculant doucement et on vérifie qu'elle tient.");
Q("manoeuvre","Quelqu'un tombe à tribord d'un bateau à moteur. Quelle barre immédiate ?","Barre à tribord (du côté de la personne) pour écarter l'arrière et l'hélice",["Barre à bâbord, à toute vitesse","Accélérer sans changer de cap","Couper tout, laisser dériver"],"Mettre la barre du côté de la personne écarte la poupe et l'hélice d'elle. Puis faire demi-tour pour revenir.");
Q("manoeuvre","Avant de hisser une personne tombée à l'eau, que faire du moteur ?","Le mettre au point mort ou l'arrêter pour éviter l'hélice",["Le laisser en marche avant","Passer en marche arrière à fond","Aucune importance"],"L'hélice est un danger majeur pour la personne dans l'eau. Moteur coupé ou au point mort pendant la récupération.");
Q("manoeuvre","Quel nœud forme une boucle fixe qui ne se resserre pas ?","Le nœud de chaise",["Le nœud plat","Le nœud en huit seul","La demi-clé"],"Le nœud de chaise est fiable, se défait facilement même après avoir été tendu. Le nœud plat sert à joindre deux bouts de même diamètre.");
Q("manoeuvre","Avant d'arriver à quai, que prépare-t-on ?","Les pare-battages et les amarres, côté d'accostage",["Rien, tout se fait à l'arrivée","Les pare-battages côté large","Seulement l'ancre"],"Anticiper : pare-battages à bonne hauteur, amarres prêtes, équipage informé du plan.");
Q("manoeuvre","Dans un sas d'écluse, il faut…","suivre les instructions de l'éclusier, utiliser les pare-battages et tenir les amarres sans les bloquer",["amarrer définitivement à un seul point","laisser le moteur à plein régime","passer sans s'amarrer"],"Le niveau de l'eau varie dans le sas. Les amarres doivent pouvoir être filées ou reprises, sans être bloquées.");
Q("manoeuvre","Au remorquage, comment procéder ?","À petite vitesse, avec une aussière solide fixée à un point résistant",["À pleine vitesse pour aller plus vite","Avec un cordon fin attaché à un hublot","Sans prévenir l'autre bateau"],"Une aussière attachée à un point faible peut arracher la structure. Vitesse lente, surveillance constante, communication claire.");
Q("manoeuvre","Quel est le danger de l'empannage involontaire ?","La bôme traverse brutalement le cockpit et peut blesser ou casser le matériel",["Le voilier s'arrête net","Le voilier chavire toujours","Il n'y a aucun risque"],"Un empannage involontaire est violent. On empanne volontairement en contrôlant l'écoute de grand-voile.");

/* --- Bonnes pratiques --- */
Q("pratique","Selon la règle des tiers, comment répartit-on le carburant ?","Un tiers pour l'aller, un tiers pour le retour, un tiers de réserve",["Deux tiers pour l'aller, le reste pour le retour","Tout pour l'aller","Moitié aller, moitié retour, sans réserve"],"Une réserve couvre les imprévus : météo, courant contraire, retour détourné.");
Q("pratique","Que faut-il vérifier avant de larguer les amarres ?","Météo, carburant, gilets, moyens de communication, matériel de sécurité",["Seulement la couleur du bateau","Seulement l'heure","Rien, on vérifie en mer"],"Une check-list de départ réduit fortement les risques en mer.");
Q("pratique","Que faire des déchets produits à bord ?","Les rapporter à terre et les trier",["Les jeter à l'eau au large","Les brûler à bord","Les cacher sous les rochers"],"Il est interdit de jeter des déchets à l'eau. Respecter l'environnement est une obligation et une marque de bon marin.");
Q("pratique","Le conducteur d'un bateau doit…","rester sobre et en état de maîtriser son bateau",["boire pour rester vigilant","laisser quelqu'un d'autre tenir la barre sans le savoir","ne pas s'inquiéter de la fatigue"],"Alcool, drogues et fatigue diminuent les réflexes. Un conducteur de bateau est responsable de la sécurité de tous à bord.");
Q("pratique","Qui est responsable des dégâts causés par le sillage d'un bateau ?","Le conducteur du bateau qui le produit",["L'autre bateau","La mer","Personne"],"Ralentir à proximité de quais, d'autres bateaux, de zones de baignade et de berges fragiles.");
Q("pratique","À quoi sert le canal VHF 16 ?","À l'appel et à la détresse : on passe ensuite sur un autre canal pour la conversation",["À discuter longtemps avec les amis","À écouter la météo en continu","À commander au port"],"Le canal 16 doit rester libre pour les urgences. Après l'appel, on bascule sur un canal de travail.");
Q("pratique","Combien de personnes peut-on embarquer ?","Au maximum le nombre indiqué sur la plaque du constructeur",["Autant que le bateau peut en contenir physiquement","Le double si on porte un gilet","Le nombre qui nous arrange"],"Surcharger un bateau dégrade fortement la stabilité et l'insubmersibilité.");
Q("pratique","Quel est l'intérêt d'un briefing sécurité avant le départ ?","Que chacun sache où sont les gilets, extincteurs, VHF et comment s'en servir",["Aucun, c'est une perte de temps","Réservé aux équipages professionnels","Seulement utile par temps de brouillard"],"En cas de problème, il n'y a pas le temps d'expliquer. Un équipage informé réagit plus vite.");
Q("pratique","Un bateau voisin est en détresse. Que faut-il faire ?","Porter assistance, dans la mesure du possible et sans danger grave pour son propre bateau",["Passer son chemin","Filmer sans intervenir","Se contenter d'observer"],"Le devoir d'assistance en mer est une obligation légale et morale. Alerter aussi les secours.");
Q("pratique","Que signifie le pavillon A (blanc et bleu, queue d'aronde) ?","« J'ai un plongeur en immersion : tenez-vous à distance et à vitesse réduite »",["Je cherche un pilote","Je suis en détresse","J'accepte les communications"],"Le pavillon A du code international signale des plongeurs. Éloigner le bateau et ralentir.");
Q("pratique","De nuit ou par visibilité réduite, il faut…","réduire sa vitesse et être particulièrement vigilant",["accélérer pour arriver vite","éteindre ses feux de navigation","ne rien changer"],"La vitesse de sécurité dépend de la visibilité. De nuit, les obstacles et autres bateaux se repèrent beaucoup plus tard.");

function cone(cx,y,dir,h,f){var w=10;return dir==='up'?'<polygon points="'+cx+','+y+' '+(cx-w)+','+(y+h)+' '+(cx+w)+','+(y+h)+'" fill="'+f+'"/>':'<polygon points="'+(cx-w)+','+y+' '+(cx+w)+','+y+' '+cx+','+(y+h)+'" fill="'+f+'"/>';}
function fig(k){
 var cx=70,B='#151515',Y='#f2c200',R='#d22b2b',G='#1fa15a',W='#fff',BL='#1f5fbf',bands=null,vert=null,shape='pillar',top='',body=null;
 if(k==='port'){body=R;shape='can';top='<rect x="60" y="22" width="20" height="26" fill="'+R+'"/>';}
 else if(k==='stbd'){body=G;shape='cone';top=cone(cx,22,'up',26,G);}
 else if(k==='N'){bands=[B,Y];top=cone(cx,8,'up',18,B)+cone(cx,30,'up',18,B);}
 else if(k==='S'){bands=[Y,B];top=cone(cx,8,'down',18,B)+cone(cx,30,'down',18,B);}
 else if(k==='E'){bands=[B,Y,B];top=cone(cx,8,'up',18,B)+cone(cx,30,'down',18,B);}
 else if(k==='W'){bands=[Y,B,Y];top=cone(cx,8,'down',18,B)+cone(cx,30,'up',18,B);}
 else if(k==='iso'){bands=[B,R,B];top='<circle cx="70" cy="16" r="9" fill="'+B+'"/><circle cx="70" cy="37" r="9" fill="'+B+'"/>';}
 else if(k==='safe'){vert=[R,W,R,W];top='<circle cx="70" cy="28" r="10" fill="'+R+'"/>';}
 else if(k==='special'){body=Y;top='<path d="M58 14 L82 42 M82 14 L58 42" stroke="'+Y+'" stroke-width="6" stroke-linecap="round"/>';}
 else if(k==='wreck'){vert=[BL,Y,BL,Y];}
 var s='<svg viewBox="0 0 140 160" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Bouée"><rect x="0" y="135" width="140" height="25" fill="#1e6fa8" opacity=".55"/><rect x="68" y="50" width="4" height="22" fill="#889"/>'+top;
 if(shape==='can')s+='<rect x="50" y="70" width="40" height="65" rx="4" fill="'+body+'"/>';
 else if(shape==='cone')s+='<polygon points="70,66 46,135 94,135" fill="'+body+'"/>';
 else if(body)s+='<rect x="52" y="70" width="36" height="65" fill="'+body+'"/>';
 else if(bands){var n=bands.length,h=65/n;for(var i=0;i<n;i++)s+='<rect x="52" y="'+(70+i*h)+'" width="36" height="'+h+'" fill="'+bands[i]+'"/>';}
 else if(vert){for(var j=0;j<4;j++)s+='<rect x="'+(52+j*9)+'" y="70" width="9" height="65" fill="'+vert[j]+'"/>';}
 s+='<path d="M0 135 Q20 128 40 135 T80 135 T120 135 T160 135" fill="none" stroke="#7cc4ee" stroke-width="3"/></svg>';
 return s;
}

function ymd(t){var d=new Date(t);return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate();}
function today(){return ymd(Date.now());}
function effStreak(){return(S.last===today()||S.last===ymd(Date.now()-864e5))?S.streak:0;}
function todayN(){return S.day.d===today()?S.day.n:0;}
function touchDay(){
 var t=today();if(S.day.d!==t)S.day={d:t,n:0};
 if(S.last!==t){S.streak=(S.last===ymd(Date.now()-864e5))?S.streak+1:1;S.last=t;S.bestStreak=Math.max(S.bestStreak,S.streak);}
}
function grade(id,ok){
 var r=S.a[id]||{box:0,due:0,n:0,w:0};r.n++;
 if(ok)r.box=Math.min(4,r.box+1);else{r.box=0;r.w++;}
 r.due=Date.now()+IV[r.box]*864e5;r.ok=ok;S.a[id]=r;
}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
function allIds(){return QS.map(function(q,i){return i;});}
function themeIds(k){return allIds().filter(function(i){return QS[i].t===k;});}
function rankIdx(xp){var r=0;RANKS.forEach(function(x,i){if(xp>=x.x)r=i;});return r;}
function rankInfo(xp){xp=xp==null?S.xp:xp;var i=rankIdx(xp),c=RANKS[i],n=RANKS[i+1];return{cur:c,next:n,p:n?Math.round(100*(xp-c.x)/(n.x-c.x)):100};}
function stats(){
 var now=Date.now(),seen=0,due=0,sum=0,wrong=0;
 QS.forEach(function(q,i){var r=S.a[i];if(r){seen++;sum+=r.box;if(r.due<=now)due++;if(r.ok===false)wrong++;}});
 return{seen:seen,due:due,unseen:QS.length-seen,ready:Math.round(100*sum/(4*QS.length)),wrong:wrong};
}
function themeStat(k){
 var ids=themeIds(k),sum=0,seen=0;ids.forEach(function(i){var r=S.a[i];if(r){seen++;sum+=r.box;}});
 var p=Math.round(100*sum/(4*ids.length));
 return{p:p,seen:seen,n:ids.length,stars:p>=85?3:p>=60?2:p>=30?1:0,master:ids.every(function(i){return S.a[i]&&S.a[i].box>=3;})};
}
function pickIds(ids,n){
 var now=Date.now(),d=[],u=[],o=[];
 ids.forEach(function(i){var r=S.a[i];if(!r)u.push(i);else if(r.due<=now)d.push(i);else o.push(i);});
 var byBox=function(a,b){return S.a[a].box-S.a[b].box;};
 return shuffle(shuffle(d).sort(byBox).concat(shuffle(u),shuffle(o).sort(byBox)).slice(0,n));
}

var AC=null;
function beep(f,t,d,type,v){var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.setValueAtTime(v||.07,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.02);}
function sfx(k){
 if(!S.sound)return;
 try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();var n=AC.currentTime;
  if(k==='ok'){beep(660,n,.12);beep(990,n+.09,.2);}
  else if(k==='ko'){beep(200,n,.28,'sawtooth',.05);}
  else if(k==='win'){[523,659,784,1047].forEach(function(f,i){beep(f,n+i*.11,.22);});}
  else if(k==='tap'){beep(520,n,.05);}
 }catch(e){}
}
function vib(p){try{if(S.sound&&navigator.vibrate)navigator.vibrate(p);}catch(e){}}
function confetti(){
 try{if(window.matchMedia('(prefers-reduced-motion: reduce)').matches)return;}catch(e){}
 var c=$('#cf'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
 var cols=['#ffc857','#38d6ff','#ff6b6b','#3ddc97','#a78bfa','#fff'],P=[],i;
 for(i=0;i<140;i++)P.push({x:Math.random()*c.width,y:-20-Math.random()*c.height*.5,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,s:6+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.3,c:cols[i%cols.length]});
 var f=0;(function loop(){x.clearRect(0,0,c.width,c.height);
  P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.04;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/3,p.s,p.s*.6);x.restore();});
  if(++f<240)requestAnimationFrame(loop);else x.clearRect(0,0,c.width,c.height);})();
}
function countUp(el,to,ms,suffix){var t0=null;suffix=suffix||'';function st(t){if(!t0)t0=t;var p=Math.min(1,(t-t0)/ms);el.textContent=Math.round(to*(1-Math.pow(1-p,3)))+suffix;if(p<1)requestAnimationFrame(st);}requestAnimationFrame(st);}

 var id=G.ids[G.i],q=QS[id],ok=oi===0,opts=ov.querySelectorAll('.opt');
 if(G.mode==='exam'){
  G.sel=oi;G.picks[G.i]=oi;
  opts.forEach(function(b){b.classList.toggle('sel',+b.getAttribute('data-o')===oi);});
  var nx=$('#nx');if(nx)nx.disabled=false;
  var sg=ov.querySelectorAll('.seg i')[G.i];if(sg)sg.className='cur';return;
 }
 G.answered=true;G.picks[G.i]=oi;G.res[G.i]=ok;grade(id,ok);touchDay();S.day.n++;
 var gain;
 if(ok){G.combo++;G.best=Math.max(G.best,G.combo);S.bestCombo=Math.max(S.bestCombo,G.combo);gain=10+Math.min(G.combo-1,5)*2;G.correct++;sfx('ok');vib(15);}
 else{G.combo=0;gain=2;sfx('ko');vib([40,40,40]);}
 G.xp+=gain;S.xp+=gain;save();
 opts.forEach(function(b){var o=+b.getAttribute('data-o');b.disabled=true;if(o===0)b.classList.add('ok');else if(o===oi)b.classList.add('ko');else b.classList.add('dim');});
 var sg2=ov.querySelectorAll('.seg i')[G.i];if(sg2)sg2.className=ok?'ok':'ko';
 var cb=$('#cb');if(cb){cb.textContent=G.combo>1?'🔥×'+G.combo:'';cb.classList.remove('pop');void cb.offsetWidth;if(G.combo>1)cb.classList.add('pop');}
 var pop=document.createElement('div');pop.className='xpop';pop.textContent='+'+gain+' XP';document.body.appendChild(pop);setTimeout(function(){pop.remove();},1100);
 var msg=ok?(G.combo>=3?'🔥 En feu ! ×'+G.combo:['Bien joué !','Exact !','Bonne réponse !'][G.i%3]):'Pas tout à fait…';
 $('#sh').innerHTML='<div class="sheet '+(ok?'ok':'ko')+'"><h3>'+(ok?'✅ ':'❌ ')+msg+'</h3><p>'+(ok?'':'<b>Bonne réponse : '+q.o[0]+'</b><br>')+q.e+'</p><button class="prim" data-a="next">'+(G.i+1<G.ids.length?'Continuer':'Voir mon résultat')+'</button></div>';
 var sh=ov.querySelector('.sheet');if(sh)sh.scrollIntoView({block:'end',behavior:'smooth'});
}
function nextQ(){
 if(!G)return;
 if(G.mode==='exam'&&G.sel===null)return;
 if(G.i+1<G.ids.length){G.i++;renderQ();ov.scrollTop=0;}else finish();
}

/* ===================== Résultat ===================== */
function finish(){
 if(!G||G.done)return;G.done=true;clearInterval(timer);
 var exam=G.mode==='exam',n=G.ids.length,score=0,wrongIds=[],i;
 if(exam){
  touchDay();
  G.ids.forEach(function(id,j){var ok=G.picks[j]===0;if(ok)score++;else wrongIds.push(id);grade(id,ok);});
  S.day.n+=n;G.xp=score*6;S.xp+=G.xp;
  var d=new Date();S.ex.push({d:d.toLocaleDateString('fr-BE')+' '+d.toLocaleTimeString('fr-BE',{hour:'2-digit',minute:'2-digit'}),s:score,n:n,p:Math.round(100*score/n)});
 }else{
  G.ids.forEach(function(id,j){if(G.res[j]===true)score++;else wrongIds.push(id);});
 }
 var p=Math.round(100*score/n),bonus=0;
 if(!exam&&p===100&&n>=5){bonus=20;S.xp+=20;G.xp+=20;S.perfect++;}
 S.sessions++;save();
 G.wrongIds=wrongIds;
 var newB=checkBadges(),rk1=rankIdx(S.xp),up=rk1>G.rk0,ri=rankInfo();
 var good=exam?p>=PASS:p>=70,stars=p>=90?3:p>=70?2:p>=40?1:0;
 var title=exam?(good?'Examen blanc réussi !':'Pas encore, mais tu progresses'):(p===100?'Sans faute !':good?'Belle séance !':'Continue, ça rentre !');
 var h='<div class="ovp"><div class="ovtop"><button class="x" data-a="close">✕</button><span style="flex:1"></span></div><div class="res">'+
  '<div class="trophy">'+(good?(p===100?'🏆':'🎉'):'⚓')+'</div><h1 style="font-size:28px;font-weight:800;margin:6px 0">'+title+'</h1>'+
  '<div class="stars">'+[0,1,2].map(function(s){return '<i class="'+(s<stars?'on':'')+'" style="animation-delay:'+(.3+s*.25)+'s">★</i>';}).join('')+'</div>'+
  '<div class="big-n"><span id="sc">0</span><span style="font-size:28px;opacity:.6">/'+n+'</span></div>'+
  '<div style="color:var(--mut);margin-top:4px"><span id="pc">0</span> %'+(exam?' · seuil indicatif '+PASS+' %':'')+'</div>'+
  '<div class="chips2"><span>+'+G.xp+' XP</span>'+(G.best>=3?'<span>🔥 combo ×'+G.best+'</span>':'')+(bonus?'<span>💯 bonus +20</span>':'')+'</div>'+
  (up?'<div class="up">🎊 Nouveau rang : '+RANKS[rk1].i+' '+RANKS[rk1].n+' !</div>':'')+
  '<div class="xpbar" style="height:10px"><i style="width:'+rankInfo(S.xp-G.xp).p+'%"></i></div><div style="font-size:12.5px;color:var(--mut);margin:6px 0 16px">'+S.xp+' XP'+(ri.next?' · '+(ri.next.x-S.xp)+' avant '+ri.next.n:'')+'</div>'+
  '<button class="prim" data-a="again">Rejouer</button>'+(wrongIds.length&&!exam?'<button class="ghost" data-a="retry">🩹 Refaire mes erreurs ('+wrongIds.length+')</button>':'')+'<button class="ghost" data-a="close">Retour à l\'accueil</button>';
 if(wrongIds.length){
  h+='<div class="sec" style="text-align:left">À revoir · '+wrongIds.length+'</div>';
  G.ids.forEach(function(id,j){if(G.picks[j]===0)return;var q=QS[id],pk=G.picks[j];
   h+='<div class="glass rev"><b>'+q.q+'</b>'+(pk!==undefined?'<div class="r">Ta réponse : '+q.o[pk]+'</div>':'<div class="r">Sans réponse</div>')+'<div class="g">✔ '+q.o[0]+'</div><div class="e">'+q.e+'</div></div>';});
 }
 h+='</div></div>';
 openOv(h);
 countUp($('#sc'),score,900);countUp($('#pc'),p,900);
 var xb=ov.querySelector('.xpbar i');if(xb)setTimeout(function(){xb.style.width=ri.p+'%';},400);
 if(good){setTimeout(confetti,250);sfx('win');vib([30,50,30]);}
 if(up)setTimeout(function(){toast(RANKS[rk1].i,'Nouveau rang',RANKS[rk1].n);},900);
}

render();
</script>
</body>
</html>
